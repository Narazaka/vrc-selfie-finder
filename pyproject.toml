[project]
name = "vrchat-picture-manager"
version = "0.1.0"
description = "VRChat自撮り写真抽出ツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics",
    "open-clip-torch",
    "torch",
    "torchvision",
    "Pillow",
    "numpy",
    "tqdm",
]

[project.scripts]
vpm = "vrchat_picture_manager.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrchat_picture_manager"]
